name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: MartinPdeS/MPSActions/.github/workflows/publish_release.yml@v17
    with:
      documentation: true
      documentation_package_name: MPSPlots
      documentation_python_version: "3.11"
      debug: true
      pypi_package_type: pure
      pypi_python_version: "3.11"
      pypi_test_command: 'python -c "import MPSPlots"'
      conda_python_versions: '["3.14"]'
      conda_os_list: '["ubuntu-latest"]'
      conda_package_name: mpsplots
      conda_recipe_path: meta.yaml
      conda_test_import: MPSPlots
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
