[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MPSPlots"
version = "1.9.6"
description = "A matplotlib wrapper for defered plots and plotting styles."
license = {file = "LICENSE"}
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Development Status :: 4 - Beta',
    'License :: OSI Approved :: MIT License',
]

keywords = ["finit-difference", "matrix"]

dependencies = [
    "matplotlib ~=3.8",
    "pyvista >=0.45.3",
]


[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
testing = [
    "pytest >=7.4,<9.0",
    "pytest-cov >=2,<8",
    "pytest-json-report ~=1.5",
    "coverage ~=7.6"
]


documentation = [
    "MartinPdeS-docs>=0.4.0,<0.5",
]

dev = [
    "flake8 ==7.1.1",
]

# Include runtime resources when building wheels from a source archive without Git.
[tool.setuptools.package-data]
MPSPlots = ["styles/*.mplstyle"]

[tool.mps-maintenance]
version-file = "MPSPlots/_version.py"
version-method = "literal"
conda-recipe = "meta.yaml"
